<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal Kelulusan &amp; Training - Jual Emas Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0B0906;
    --surface:#161310;
    --surface-2:#201B14;
    --border:#3A311F;
    --text:#F5EFE0;
    --text-muted:#9C9184;
    --gold:#D4AF37;
    --gold-bright:#F2D577;
    --gold-deep:#96731A;
    --gold-soft:rgba(212,175,55,0.14);
    --pass:#8FBF7A;
    --pass-soft:rgba(143,191,122,0.15);
    --fail:#C1493F;
    --fail-soft:rgba(193,73,63,0.15);
    --pending:#D4AF37;
    --pending-soft:rgba(212,175,55,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, rgba(212,175,55,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  header.top{text-align:center;margin-bottom:20px;}
  .logo-img{width:96px;height:96px;object-fit:contain;margin-bottom:6px;}
  .brand-name{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.02em;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin:2px 0 2px;
  }
  .brand-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin-bottom:10px;
  }
  .subtitle{color:var(--text-muted);font-size:13px;margin:0;}

  nav.tabs{
    display:flex;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:5px;
    margin-bottom:8px;
  }
  nav.tabs button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:9px 5px;
    border-radius:8px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  nav.tabs button.active{
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    color:#1a1408;
  }
  .admin-link{
    text-align:center;margin-bottom:20px;
  }
  .admin-link a{
    color:var(--text-muted);
    font-size:11.5px;
    text-decoration:none;
    border-bottom:1px dotted var(--border);
    cursor:pointer;
  }
  .admin-link a:hover{color:var(--gold);}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Playfair Display',serif;
    font-size:18px;
    margin:0 0 4px;
    font-weight:600;
    color:var(--gold-bright);
  }
  .card .hint{color:var(--text-muted);font-size:12.5px;margin:0 0 16px;}

  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
    margin-bottom:6px;
    margin-top:14px;
  }
  label:first-of-type{margin-top:0;}
  input[type=text], input[type=password], input[type=number], select, textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 12px;
    border-radius:9px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
  }
  input.mono{font-family:'JetBrains Mono',monospace;letter-spacing:0.04em;}
  input:focus, select:focus, textarea:focus{border-color:var(--gold);}
  textarea{resize:vertical;min-height:60px;}
  input[type=file]{
    width:100%;background:var(--surface-2);border:1px dashed var(--border);
    color:var(--text-muted);padding:14px 12px;border-radius:9px;font-size:12.5px;
  }

  button.btn{
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    color:#1a1408;
    border:none;
    padding:12px 18px;
    border-radius:9px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    width:100%;
    margin-top:16px;
    transition:filter .15s ease;
  }
  button.btn:hover{filter:brightness(1.08);}
  button.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  button.btn.danger{background:var(--fail-soft);color:var(--fail);border:1px solid rgba(193,73,63,0.35);}
  button.btn.small{width:auto;padding:8px 12px;font-size:12.5px;margin-top:0;}
  button.btn.tiny{width:auto;padding:5px 9px;font-size:11.5px;margin-top:0;border-radius:6px;}

  .msg{font-size:13px;padding:10px 12px;border-radius:9px;margin-top:12px;}
  .msg.error{background:var(--fail-soft);color:var(--fail);}
  .msg.info{background:var(--gold-soft);color:var(--gold-bright);}

  .seal-wrap{display:flex;justify-content:center;margin:6px 0 18px;}
  .seal{
    width:132px;height:132px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;
    animation:sealIn .45s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes sealIn{from{opacity:0;transform:scale(.7) rotate(-8deg);}to{opacity:1;transform:scale(1) rotate(0);}}
  .seal .status-word{font-family:'Playfair Display',serif;font-weight:700;font-size:16.5px;line-height:1.15;}
  .seal.pass{border:3px double var(--gold);background:radial-gradient(circle,var(--pass-soft),transparent 70%);color:var(--pass);}
  .seal.fail{border:2px solid var(--fail);background:var(--fail-soft);color:var(--fail);}
  .seal.pending{border:2px dashed var(--pending);background:var(--pending-soft);color:var(--pending);}

  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--text-muted);}
  .kv .v{font-weight:600;text-align:right;}

  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
  th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border);}
  td{padding:9px 8px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.pass{background:var(--pass-soft);color:var(--pass);}
  .badge.fail{background:var(--fail-soft);color:var(--fail);}
  .badge.pending{background:var(--pending-soft);color:var(--pending);}

  .kpi-row{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:end;margin-bottom:8px;}
  .kpi-row input{margin:0;}
  .kpi-row .del{background:var(--fail-soft);color:var(--fail);border:none;border-radius:8px;width:36px;height:38px;cursor:pointer;font-size:15px;}

  .row-actions{display:flex;gap:8px;margin-top:8px;}
  .row-actions button{flex:1;}

  .q-block{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .q-block .q-text{font-weight:600;margin-bottom:10px;font-size:14px;}
  .opt-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:400;color:var(--text);padding:7px 9px;border-radius:7px;cursor:pointer;margin-bottom:4px;background:var(--surface);}
  .opt-label input{width:auto;margin:0;}

  .admin-lock{text-align:center;padding:30px 20px;}
  .divider{height:1px;background:var(--border);margin:18px 0;}

  .empty{color:var(--text-muted);font-size:13px;text-align:center;padding:18px 0;}
  .loading{color:var(--text-muted);font-size:13px;text-align:center;padding:18px 0;}

  .sub-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .sub-tabs button{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;
  }
  .sub-tabs button.active{background:var(--gold-soft);color:var(--gold-bright);border-color:var(--gold);}

  .menu-row{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 10px;margin-bottom:8px;}
  .menu-row input[type=text]{flex:1;padding:7px 9px;font-size:13px;}
  .menu-row .menu-type{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);white-space:nowrap;}
  .menu-row .menu-btns{display:flex;gap:4px;}
  .switch{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-muted);white-space:nowrap;}
  .preview-table-wrap{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:9px;}

  .brand-content p{font-size:13.5px;line-height:1.6;color:var(--text);margin:0 0 10px;}

  /* Certificate */
  .cert-wrap{
    background:linear-gradient(160deg,#141009,#0B0906);
    border:2px solid var(--gold);
    border-radius:6px;
    padding:34px 26px;
    position:relative;
    overflow:hidden;
  }
  .cert-wrap::before{content:'';position:absolute;inset:9px;border:1px solid var(--gold-deep);pointer-events:none;border-radius:2px;}
  .cert-logo{width:56px;height:56px;object-fit:contain;margin:0 auto 10px;display:block;}
  .cert-title{font-family:'Playfair Display',serif;font-size:20px;text-align:center;color:var(--gold-bright);letter-spacing:0.04em;margin:6px 0 2px;text-transform:uppercase;}
  .cert-sub{text-align:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--gold-deep);text-transform:uppercase;margin-bottom:20px;}
  .cert-name{font-family:'Playfair Display',serif;font-size:23px;text-align:center;color:var(--text);margin:12px 0;border-bottom:1px solid var(--gold-deep);padding-bottom:10px;}
  .cert-body{font-size:12.5px;line-height:1.8;color:var(--text);text-align:center;max-width:440px;margin:0 auto 18px;}
  .cert-meta{display:flex;justify-content:center;gap:18px;font-size:10.5px;color:var(--text-muted);margin-bottom:24px;font-family:'JetBrains Mono',monospace;flex-wrap:wrap;}
  .cert-sign{text-align:center;margin-top:6px;}
  .cert-sign .line{width:150px;border-bottom:1px solid var(--gold-deep);margin:34px auto 6px;}
  .cert-sign .name{font-weight:700;font-size:12.5px;}
  .cert-sign .jabatan{font-size:10.5px;color:var(--text-muted);}
  .cert-footer{text-align:center;margin-top:18px;font-size:9px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;letter-spacing:.03em;}
  #cert-print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #cert-print-area, #cert-print-area *{visibility:visible;}
    #cert-print-area{display:block;position:absolute;top:0;left:0;width:100%;padding:24px;}
    #cert-print-area .cert-wrap{background:#fff !important;color:#161310 !important;border-color:#B8860B !important;box-shadow:none;}
    #cert-print-area .cert-wrap::before{border-color:#B8860B !important;}
    #cert-print-area .cert-title{color:#8A6A12 !important;}
    #cert-print-area .cert-name{color:#161310 !important;border-color:#B8860B !important;}
    #cert-print-area .cert-body{color:#2B2620 !important;}
    #cert-print-area .cert-meta{color:#555 !important;}
    #cert-print-area .cert-sign .line{border-color:#B8860B !important;}
    #cert-print-area .cert-sign .jabatan{color:#555 !important;}
    #cert-print-area .cert-footer{color:#777 !important;}
  }
</style>
</head>

  <nav class="tabs" id="main-tabs"></nav>

  <div id="tab-content"></div>

<div id="cert-print-area"></div>

<script>
(function(){
  const DEFAULT_PIN = "emas2026";
  const DEFAULT_MENU = [
    { id:'cek', type:'core-cek', label:'Cek Kelulusan', visible:true },
    { id:'test', type:'core-test', label:'Post Test', visible:true },
    { id:'rapot', type:'core-rapot', label:'Rapot', visible:true }
  ];

  const DEFAULT_CERT_CONFIG = {
    programName: 'Sertifikasi Kompetensi Penjualan Emas',
    perusahaan: 'Jual Emas Indonesia',
    penandatangan: 'Syafran Umari, SE',
    jabatan: 'General Manager',
    templateLulus: 'Sertifikat ini diberikan kepada {nama} sebagai bukti bahwa yang bersangkutan telah mengikuti rangkaian program pelatihan {program} yang diselenggarakan oleh {perusahaan}, dan dinyatakan LULUS berdasarkan hasil evaluasi yang telah ditetapkan.\n\nSertifikat ini merupakan bentuk pengakuan resmi atas kompetensi, dedikasi, dan komitmen yang telah ditunjukkan selama mengikuti program pelatihan.',
    templateTidakLulus: 'Surat keterangan ini menyatakan bahwa {nama} telah mengikuti program pelatihan {program} yang diselenggarakan oleh {perusahaan}.\n\nBerdasarkan hasil evaluasi, yang bersangkutan belum memenuhi standar kelulusan yang ditetapkan pada periode ini. Kami mengapresiasi partisipasi yang telah diberikan dan mendorong yang bersangkutan untuk mengikuti sesi pembinaan lanjutan guna mencapai standar kompetensi yang diharapkan.'
  };

  let pesertaData = {};
  let postTestLinks = [];
  let postTestResults = {};
  let kkm = 80;
  let menuConfig = DEFAULT_MENU.map(t=>({...t}));
  let sertifikatConfig = {...DEFAULT_CERT_CONFIG};
  let adminUnlocked = false;
  let activeTabId = null;
  let importedRows = null;

  // ---------- helpers ----------
  function normKode(k){ return (k || "").trim().toUpperCase(); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function fillTemplate(tpl, data){ return String(tpl||'').replace(/\{(\w+)\}/g, (m,key)=> (data[key]!==undefined && data[key]!==null && data[key]!=='') ? data[key] : m); }

  // PENTING: window.storage hanya berfungsi di dalam preview Claude, TIDAK di website yang
  // sudah di-hosting sendiri (GitHub Pages, dsb). Supaya data admin (peserta, nilai, dsb) benar-benar
  // tersimpan permanen di GitHub Pages, portal ini memakai Google Apps Script sebagai backend gratis.
  // WAJIB DIISI: ganti nilai di bawah ini dengan URL Web App Google Apps Script kamu (lihat panduan setup).
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzxMFMrBR3piWVW7lB4LRB_A4PwLQlg4HbgWMRPMc0fML4G4SNVQkUB1IfHsr2DwYsi9w/exec";

  async function safeGet(key){
    if(!BACKEND_URL || BACKEND_URL.indexOf('PASTE_URL') === 0){
      console.warn('BACKEND_URL belum diisi. Data tidak akan tersimpan permanen.');
      return null;
    }
    try{
      const res = await fetch(BACKEND_URL + '?key=' + encodeURIComponent(key));
      const data = await res.json();
      return (data && data.value) ? JSON.parse(data.value) : null;
    }catch(e){ return null; }
  }
  async function safeSet(key, value){
    if(!BACKEND_URL || BACKEND_URL.indexOf('PASTE_URL') === 0){
      console.warn('BACKEND_URL belum diisi. Data tidak akan tersimpan permanen.');
      return false;
    }
    try{
      await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key, value: JSON.stringify(value) })
      });
      return true;
    }catch(e){ return false; }
  }

  async function loadAll(){
    const [p, links, results, kkmVal, m, cert] = await Promise.all([
      safeGet('peserta_data'),
      safeGet('posttest_links'),
      safeGet('posttest_results'),
      safeGet('posttest_kkm'),
      safeGet('menu_config'),
      safeGet('sertifikat_config')
    ]);
    pesertaData = p || {};
    postTestLinks = links || [];
    postTestResults = results || {};
    kkm = (kkmVal !== null && kkmVal !== undefined) ? kkmVal : 80;
    menuConfig = (m && m.length) ? m : DEFAULT_MENU.map(t=>({...t}));
    sertifikatConfig = cert ? {...DEFAULT_CERT_CONFIG, ...cert} : {...DEFAULT_CERT_CONFIG};
  }

  // ================= NAV =================
  function renderNav(){
    const nav = document.getElementById('main-tabs');
    const visible = menuConfig.filter(t=>t.visible !== false);
    if(!activeTabId || !visible.find(t=>t.id===activeTabId)){
      activeTabId = visible.length ? visible[0].id : null;
    }
    nav.innerHTML = visible.map(t=>`<button data-tab="${esc(t.id)}" class="${t.id===activeTabId && !adminActive ? 'active':''}">${esc(t.label)}</button>`).join('');
    nav.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        adminActive = false;
        activeTabId = b.dataset.tab;
        renderNav();
        renderActiveTab();
      });
    });
  }

  let adminActive = false;
  document.getElementById('admin-link').addEventListener('click', ()=>{
    adminActive = true;
    renderNav();
    renderActiveTab();
  });

  function renderActiveTab(){
    const area = document.getElementById('tab-content');
    if(adminActive){
      renderAdminEntry(area);
      return;
    }
    const tab = menuConfig.find(t=>t.id===activeTabId);
    if(!tab){ area.innerHTML = '<div class="empty">Belum ada menu.</div>'; return; }
    if(tab.type === 'core-cek') renderCekPanel(area);
    else if(tab.type === 'core-test') renderTestPanel(area);
    else if(tab.type === 'core-rapot') renderRapotPanel(area);
    else if(tab.type === 'custom') renderCustomPanel(area, tab);
  }

  function renderCustomPanel(area, tab){
    const paragraphs = (tab.content||'').split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('');
    area.innerHTML = `<div class="card"><h2>${esc(tab.label)}</h2><div class="brand-content">${paragraphs || '<p class="hint">Belum ada konten.</p>'}</div></div>`;
  }

  // ================= CEK KELULUSAN =================
  function renderCekPanel(area){
    area.innerHTML = `
      <div class="card">
        <h2>Cek Status Kelulusan</h2>
        <p class="hint">Masukkan kode unik yang diberikan trainer untuk melihat status kelulusan kamu.</p>
        <label>Kode Unik Peserta</label>
        <input type="text" id="cek-kode" class="mono" placeholder="Contoh: JEI-0231" autocomplete="off" />
        <button class="btn" id="cek-btn">Cek Status</button>
        <div id="cek-msg"></div>
      </div>
      <div id="cek-result"></div>
    `;
    document.getElementById('cek-btn').addEventListener('click', async ()=>{
      const kode = normKode(document.getElementById('cek-kode').value);
      const msgEl = document.getElementById('cek-msg');
      const resultEl = document.getElementById('cek-result');
      msgEl.innerHTML = ''; resultEl.innerHTML = '';
      if(!kode){ msgEl.innerHTML = '<div class="msg error">Masukkan kode unik terlebih dahulu.</div>'; return; }
      msgEl.innerHTML = '<div class="loading">Memeriksa data...</div>';
      await loadAll();
      msgEl.innerHTML = '';
      const p = pesertaData[kode];
      if(!p){ msgEl.innerHTML = '<div class="msg error">Kode tidak ditemukan. Periksa kembali kode unik kamu, atau hubungi trainer.</div>'; return; }
      const statusClass = p.status === 'LULUS' ? 'pass' : (p.status === 'TIDAK LULUS' ? 'fail' : 'pending');
      const statusLabel = p.status === 'LULUS' ? 'LULUS' : (p.status === 'TIDAK LULUS' ? 'TIDAK LULUS' : 'MENUNGGU');
      let certButton = '';
      if(p.status === 'LULUS') certButton = '<button class="btn" id="lihat-sertifikat-btn">Lihat Sertifikat Kelulusan</button>';
      else if(p.status === 'TIDAK LULUS') certButton = '<button class="btn secondary" id="lihat-sertifikat-btn">Lihat Surat Keterangan</button>';
      resultEl.innerHTML = `
        <div class="card" style="text-align:center;">
          <div class="seal-wrap"><div class="seal ${statusClass}"><div class="status-word">${statusLabel}</div></div></div>
          <h2 style="margin-bottom:2px;">${esc(p.nama || '-')}</h2>
          <p class="hint" style="margin-bottom:0;">Kode: ${esc(kode)}${p.batch ? ' &middot; Batch '+esc(p.batch) : ''}</p>

        ${p.catatanUmum ? `<div class="card"><h2>Catatan Trainer</h2><p style="font-size:13.5px;color:var(--text-muted);margin:0;">${esc(p.catatanUmum)}</p></div>` : ''}
        <div id="cert-area"></div>
      `;
      const certBtn = document.getElementById('lihat-sertifikat-btn');
      if(certBtn){
        certBtn.addEventListener('click', ()=> showCertificate(kode, p, p.status === 'LULUS'));
      }
    });
  }

  // ================= SERTIFIKAT =================
  function certInnerHTML(p, kode, isLulus, cfg){
    const logoSrc = document.querySelector('.logo-img') ? document.querySelector('.logo-img').src : '';
    const tpl = isLulus ? cfg.templateLulus : cfg.templateTidakLulus;
    const data = { nama: p.nama || '-', kode, batch: p.batch || '-', tanggal: p.tanggal || '-', program: cfg.programName || '-', perusahaan: cfg.perusahaan || '-' };
    const filled = fillTemplate(tpl, data);
    const bodyHtml = esc(filled).split(/\n+/).filter(Boolean).map(par=>`<p style="margin:0 0 10px;">${par}</p>`).join('');
    const title = isLulus ? 'Sertifikat Kelulusan' : 'Surat Keterangan Keikutsertaan';
    return `
      <div class="cert-wrap">
        ${logoSrc ? `<img src="${logoSrc}" class="cert-logo" alt="logo" />` : ''}
        <div class="cert-title">${esc(title)}</div>
        <div class="cert-sub">${esc(cfg.perusahaan || '')}</div>
        <div class="cert-name">${esc(p.nama || '-')}</div>
        <div class="cert-body">${bodyHtml}</div>
        <div class="cert-meta">
          <span>Kode: ${esc(kode)}</span>
          ${p.batch ? `<span>Batch: ${esc(p.batch)}</span>` : ''}
          <span>Tanggal: ${esc(p.tanggal || '-')}</span>
        </div>
        <div class="cert-sign">
          <div class="line"></div>
          <div class="name">${esc(cfg.penandatangan || '-')}</div>
          <div class="jabatan">${esc(cfg.jabatan || '-')}</div>
        </div>
        <div class="cert-footer">Kode Verifikasi: ${esc(kode)} &middot; ${esc(cfg.perusahaan || '')}</div>
      </div>
    `;
  }

  async function showCertificate(kode, p, isLulus){
    const certArea = document.getElementById('cert-area');

    await loadAll();
    const cfg = sertifikatConfig;
    const inner = certInnerHTML(p, kode, isLulus, cfg);
    if(certArea){
      certArea.innerHTML = `
        <div class="card">
          ${inner}
          <button class="btn secondary" id="cetak-sertifikat-btn">Cetak / Simpan sebagai PDF</button>
        </div>
      `;
      document.getElementById('cetak-sertifikat-btn').addEventListener('click', ()=>{
        document.getElementById('cert-print-area').innerHTML = inner;
        window.print();
      });
    }
  }

  // --- Admin: Peserta (+ Excel import) ---
  let editingKode = null;
  let kpiDraft = [];

  function findCol(row, names){
    const keys = Object.keys(row);
    for(const name of names){
      const k = keys.find(kk => kk.trim().toLowerCase() === name.toLowerCase());
      if(k !== undefined) return row[k];
    }
    return '';
  }

  function renderAdminPeserta(area){
    const kodes = Object.keys(pesertaData).sort();
    area.innerHTML = `
      <div class="card">
        <h2>Import dari Excel / CSV</h2>
        <p class="hint">Kolom yang dikenali: <b>Kode, Nama, Batch, Status, Catatan</b>, dan kolom KPI ditulis dengan awalan <b>KPI: nama aspek</b> (misal "KPI: Kedisiplinan").</p>
        <input type="file" id="import-file" accept=".xlsx,.xls,.csv" />
        <div id="import-preview"></div>
        <button class="btn secondary" id="download-template-btn">Unduh Template Excel</button>
      </div>
      <div class="card">
        <h2>${editingKode ? 'Edit Peserta' : 'Tambah Peserta Manual'}</h2>
        <label>Kode Unik</label>
        <input type="text" id="f-kode" class="mono" ${editingKode ? 'disabled' : ''} />
        <label>Nama Peserta</label>
        <input type="text" id="f-nama" />
        <label>Batch / Angkatan</label>
        <input type="text" id="f-batch" />
        <label>Tanggal Kelulusan</label>
        <input type="text" id="f-tanggal" placeholder="mis. 30 Juli 2026" />
        <label>Status Kelulusan</label>
        <select id="f-status">
          <option value="PENDING">Menunggu</option>
          <option value="LULUS">Lulus</option>
          <option value="TIDAK LULUS">Tidak Lulus</option>
        </select>
        <label>Catatan Trainer (opsional)</label>
        <textarea id="f-catatan"></textarea>
        <div class="divider"></div>
        <label style="margin-top:0;">Rapot / KPI</label>
        <div id="kpi-rows"></div>
        <button class="btn secondary small" id="add-kpi-row">+ Tambah Aspek KPI</button>
        <div class="row-actions">
          <button class="btn" id="save-peserta-btn">${editingKode ? 'Simpan Perubahan' : 'Tambah Peserta'}</button>
          ${editingKode ? '<button class="btn secondary" id="cancel-edit-btn">Batal</button>' : ''}
        </div>
        <div id="peserta-form-msg"></div>
      </div>
      <div class="card">
        <h2>Daftar Peserta (${kodes.length})</h2>
        ${kodes.length ? `<table><thead><tr><th>Kode</th><th>Nama</th><th>Status</th><th></th></tr></thead><tbody>
          ${kodes.map(k=>{
            const p = pesertaData[k];
            const cls = p.status==='LULUS'?'pass':(p.status==='TIDAK LULUS'?'fail':'pending');
            return `<tr>
              <td class="mono" style="font-family:'JetBrains Mono',monospace;">${esc(k)}</td>
              <td>${esc(p.nama||'-')}</td>
              <td><span class="badge ${cls}">${esc(p.status||'PENDING')}</span></td>
              <td style="white-space:nowrap;">
                <button class="btn secondary small" data-edit="${esc(k)}">Edit</button>
                <button class="btn danger small" data-del="${esc(k)}">Hapus</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody></table>` : '<div class="empty">Belum ada peserta.</div>'}
      </div>
    `;

    // Excel import wiring
    document.getElementById('download-template-btn').addEventListener('click', ()=>{
      const wsData = [
        ['Kode','Nama','Batch','Status','Tanggal','Catatan','KPI: Kedisiplinan','KPI: Kerapian','KPI: Pengetahuan Produk'],
        ['JEI-0001','Contoh Nama','Batch 1','LULUS','30 Juli 2026','Catatan opsional',85,90,88]
      ];
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Template');
      XLSX.writeFile(wb, 'template-peserta-jei.xlsx');
    });

    document.getElementById('import-file').addEventListener('change', (e)=>{
      const file = e.target.files[0];
      const previewEl = document.getElementById('import-preview');
      if(!file) return;
      previewEl.innerHTML = '<div class="loading">Membaca file...</div>';
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data, { type:'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
          if(!rows.length){ previewEl.innerHTML = '<div class="msg error">File kosong atau format tidak dikenali.</div>'; return; }
          importedRows = rows.map(row=>{
            const kode = normKode(findCol(row, ['Kode']));
            const nama = String(findCol(row, ['Nama'])).trim();
            const batch = String(findCol(row, ['Batch'])).trim();
            const tanggal = String(findCol(row, ['Tanggal'])).trim();
            let status = String(findCol(row, ['Status'])).trim().toUpperCase();
            if(!['LULUS','TIDAK LULUS','PENDING'].includes(status)) status = 'PENDING';
            const catatanUmum = String(findCol(row, ['Catatan'])).trim();
            const kpi = [];
            Object.keys(row).forEach(colName=>{
              if(colName.trim().toLowerCase().startsWith('kpi:')){
                const aspek = colName.trim().slice(4).trim();
                const skor = row[colName];
                if(aspek && String(skor).trim() !== '') kpi.push({ aspek, skor, catatan:'' });
              }
            });
            return { kode, nama, batch, tanggal, status, catatanUmum, kpi };
          }).filter(r=>r.kode && r.nama);
          if(!importedRows.length){
            previewEl.innerHTML = '<div class="msg error">Tidak ada baris valid (kolom Kode dan Nama wajib diisi).</div>';
            return;
          }
          previewEl.innerHTML = `
            <div class="msg info">${importedRows.length} peserta siap diimpor.</div>
            <div class="preview-table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Status</th><th>KPI</th></tr></thead><tbody>
              ${importedRows.slice(0,50).map(r=>`<tr><td class="mono" style="font-family:'JetBrains Mono',monospace;">${esc(r.kode)}</td><td>${esc(r.nama)}</td><td>${esc(r.status)}</td><td>${r.kpi.length} aspek</td></tr>`).join('')}
            </tbody></table></div>
            <button class="btn" id="confirm-import-btn">Import ${importedRows.length} Peserta Sekarang</button>
          `;
          document.getElementById('confirm-import-btn').addEventListener('click', async ()=>{
            importedRows.forEach(r=>{
              pesertaData[r.kode] = { nama:r.nama, batch:r.batch, tanggal:r.tanggal, status:r.status, catatanUmum:r.catatanUmum, kpi:r.kpi };
            });
            previewEl.innerHTML = '<div class="loading">Menyimpan...</div>';
            await safeSet('peserta_data', pesertaData);
            importedRows = null;
            renderAdminPeserta(area);
          });
        }catch(err){
          previewEl.innerHTML = '<div class="msg error">Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv.</div>';
        }
      };
      reader.readAsArrayBuffer(file);
    });

    if(editingKode){
      const p = pesertaData[editingKode];
      document.getElementById('f-kode').value = editingKode;
      document.getElementById('f-nama').value = p.nama || '';
      document.getElementById('f-batch').value = p.batch || '';
      document.getElementById('f-tanggal').value = p.tanggal || '';
      document.getElementById('f-status').value = p.status || 'PENDING';
      document.getElementById('f-catatan').value = p.catatanUmum || '';
      kpiDraft = (p.kpi || []).map(k=>({...k}));
    } else {
      kpiDraft = [];
    }
    renderKpiRows();

    document.getElementById('add-kpi-row').addEventListener('click', ()=>{
      kpiDraft.push({ aspek:'', skor:'', catatan:'' });
      renderKpiRows();
    });

    area.querySelectorAll('[data-edit]').forEach(b=>{
      b.addEventListener('click', ()=>{ editingKode = b.dataset.edit; renderAdminPeserta(area); });
    });
    area.querySelectorAll('[data-del]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('Hapus peserta ' + b.dataset.del + '?')) return;
        delete pesertaData[b.dataset.del];
        await safeSet('peserta_data', pesertaData);
        renderAdminPeserta(area);
      });
    });

    const cancelBtn = document.getElementById('cancel-edit-btn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingKode = null; renderAdminPeserta(area); });

    document.getElementById('save-peserta-btn').addEventListener('click', async ()=>{
      const msgEl = document.getElementById('peserta-form-msg');
      const kode = normKode(document.getElementById('f-kode').value);
      const nama = document.getElementById('f-nama').value.trim();
      if(!kode || !nama){ msgEl.innerHTML = '<div class="msg error">Kode dan nama wajib diisi.</div>'; return; }
      if(!editingKode && pesertaData[kode]){ msgEl.innerHTML = '<div class="msg error">Kode ini sudah dipakai peserta lain.</div>'; return; }
      const kpi = kpiDraft.map(k=>({ aspek: (k.aspek||'').trim(), skor: k.skor, catatan: (k.catatan||'').trim() })).filter(k=>k.aspek);
      pesertaData[kode] = {
        nama,
        batch: document.getElementById('f-batch').value.trim(),
        tanggal: document.getElementById('f-tanggal').value.trim(),
        status: document.getElementById('f-status').value,
        catatanUmum: document.getElementById('f-catatan').value.trim(),
        kpi
      };
      msgEl.innerHTML = '<div class="loading">Menyimpan...</div>';
      await safeSet('peserta_data', pesertaData);
      editingKode = null;
      renderAdminPeserta(area);
    });
  }

  function renderKpiRows(){
    const wrap = document.getElementById('kpi-rows');
    if(!wrap) return;
    if(!kpiDraft.length){ wrap.innerHTML = '<div class="empty" style="padding:6px 0;">Belum ada aspek KPI.</div>'; return; }
    wrap.innerHTML = kpiDraft.map((k,i)=>`
      <div class="kpi-row">
        <div><label style="margin:0 0 4px;">Aspek</label><input type="text" data-kpi-aspek="${i}" value="${esc(k.aspek)}" placeholder="mis. Kedisiplinan" /></div>
        <div><label style="margin:0 0 4px;">Skor</label><input type="text" data-kpi-skor="${i}" value="${esc(k.skor)}" placeholder="85" /></div>
        <button class="del" data-kpi-del="${i}" title="Hapus">&times;</button>
      </div>
    `).join('') + `<label style="margin-top:2px;">Catatan per aspek (opsional)</label>` +
    kpiDraft.map((k,i)=>`<input type="text" data-kpi-catatan="${i}" value="${esc(k.catatan)}" placeholder="Catatan singkat" style="margin-bottom:8px;" />`).join('');

    wrap.querySelectorAll('[data-kpi-aspek]').forEach(inp=>{ inp.addEventListener('input', ()=>{ kpiDraft[inp.dataset.kpiAspek].aspek = inp.value; }); });
    wrap.querySelectorAll('[data-kpi-skor]').forEach(inp=>{ inp.addEventListener('input', ()=>{ kpiDraft[inp.dataset.kpiSkor].skor = inp.value; }); });
    wrap.querySelectorAll('[data-kpi-catatan]').forEach(inp=>{ inp.addEventListener('input', ()=>{ kpiDraft[inp.dataset.kpiCatatan].catatan = inp.value; }); });
    wrap.querySelectorAll('[data-kpi-del]').forEach(btn=>{ btn.addEventListener('click', ()=>{ kpiDraft.splice(parseInt(btn.dataset.kpiDel,10),1); renderKpiRows(); }); });
  }

  // --- Admin: Post Test (link eksternal + KKM + input nilai) ---
  let editingLinkId = null;

  function renderAdminPostTest(area){
    const editing = editingLinkId ? postTestLinks.find(l=>l.id===editingLinkId) : null;
    const flatResults = [];
    Object.keys(postTestResults).forEach(kode=>{
      Object.keys(postTestResults[kode]).forEach(linkId=>{
        const h = postTestResults[kode][linkId];
        const link = postTestLinks.find(l=>l.id===linkId);
        flatResults.push({ kode, linkId, judul: link ? link.judul : '(link dihapus)', skor: h.skor, waktu: h.waktu });
      });
    });
    flatResults.sort((a,b)=> (a.kode+a.linkId).localeCompare(b.kode+b.linkId));

    area.innerHTML = `
      <div class="card">
        <h2>KKM (Kriteria Kelulusan Minimum)</h2>
        <p class="hint">Nilai minimum untuk dinyatakan lulus post-test.</p>
        <label>KKM</label>
        <input type="number" id="kkm-input" value="${esc(kkm)}" min="0" max="100" />
        <button class="btn secondary" id="save-kkm-btn">Simpan KKM</button>
        <div id="kkm-msg"></div>
      </div>

      <div class="card">
        <h2>${editing ? 'Edit Link Post-Test' : 'Tambah Link Post-Test'}</h2>
        <p class="hint">Isi link Google Docs/Form post-test beserta deskripsinya. Peserta akan melihat ini di menu Post Test.</p>
        <label>Judul</label>
        <input type="text" id="l-judul" value="${editing ? esc(editing.judul) : ''}" placeholder="mis. Post-Test Modul 1" />
        <label>Deskripsi</label>
        <textarea id="l-deskripsi" placeholder="Penjelasan singkat tentang post-test ini">${editing ? esc(editing.deskripsi) : ''}</textarea>
        <label>URL Google Docs/Form</label>
        <input type="text" id="l-url" class="mono" value="${editing ? esc(editing.url) : ''}" placeholder="https://docs.google.com/..." />
        <div class="row-actions">
          <button class="btn" id="save-link-btn">${editing ? 'Simpan Perubahan' : 'Tambah Link'}</button>
          ${editing ? '<button class="btn secondary" id="cancel-link-btn">Batal</button>' : ''}
        </div>
        <div id="link-form-msg"></div>
      </div>
      <div class="card">
        <h2>Daftar Link Post-Test (${postTestLinks.length})</h2>
        ${postTestLinks.length ? postTestLinks.map(l=>`
          <div class="q-block">
            <div class="q-text">${esc(l.judul)} ${l.aktif===false ? '<span class="badge pending">Nonaktif</span>' : ''}</div>
            <p class="hint" style="margin:0 0 8px;">${esc(l.deskripsi||'')}</p>
            <div class="row-actions">
              <button class="btn secondary small" data-edit-link="${l.id}">Edit</button>
              <button class="btn secondary small" data-toggle-link="${l.id}">${l.aktif===false ? 'Aktifkan' : 'Nonaktifkan'}</button>
              <button class="btn danger small" data-del-link="${l.id}">Hapus</button>
            </div>
          </div>
        `).join('') : '<div class="empty">Belum ada link post-test.</div>'}
      </div>

      <div class="card">
        <h2>Input / Update Nilai Peserta</h2>
        <label>Kode Unik Peserta</label>
        <input type="text" id="n-kode" class="mono" placeholder="Contoh: JEI-0231" />
        <label>Link Post-Test</label>
        <select id="n-link">
          <option value="">-- Pilih link --</option>
          ${postTestLinks.map(l=>`<option value="${l.id}">${esc(l.judul)}</option>`).join('')}
        </select>
        <label>Skor (0-100)</label>
        <input type="number" id="n-skor" min="0" max="100" />
        <button class="btn" id="save-nilai-btn">Simpan Nilai</button>
        <div id="nilai-form-msg"></div>
      </div>

      <div class="card">
        <h2>Rekap Nilai Peserta (${flatResults.length})</h2>
        ${flatResults.length ? `<div class="preview-table-wrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Post-Test</th><th>Skor</th><th></th></tr></thead><tbody>
          ${flatResults.map(r=>{
            const p = pesertaData[r.kode];
            const lulus = Number(r.skor) >= Number(kkm);
            return `<tr>
              <td class="mono" style="font-family:'JetBrains Mono',monospace;">${esc(r.kode)}</td>
              <td>${esc(p ? p.nama : '-')}</td>
              <td>${esc(r.judul)}</td>
              <td>${esc(r.skor)} <span class="badge ${lulus?'pass':'fail'}">${lulus?'L':'TL'}</span></td>
              <td><button class="btn danger tiny" data-del-nilai="${esc(r.kode)}|${esc(r.linkId)}">Hapus</button></td>
            </tr>`;
          }).join('')}
        </tbody></table></div>` : '<div class="empty">Belum ada nilai yang diinput.</div>'}
      </div>
    `;

    document.getElementById('save-kkm-btn').addEventListener('click', async ()=>{
      const msgEl = document.getElementById('kkm-msg');
      const val = parseInt(document.getElementById('kkm-input').value, 10);
      if(isNaN(val) || val < 0 || val > 100){ msgEl.innerHTML = '<div class="msg error">Masukkan angka 0-100.</div>'; return; }
      msgEl.innerHTML = '<div class="loading">Menyimpan...</div>';
      kkm = val;
      await safeSet('posttest_kkm', kkm);
      msgEl.innerHTML = '<div class="msg info">KKM berhasil disimpan.</div>';
    });

    area.querySelectorAll('[data-edit-link]').forEach(b=>{ b.addEventListener('click', ()=>{ editingLinkId = b.dataset.editLink; renderAdminPostTest(area); }); });
    area.querySelectorAll('[data-toggle-link]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const l = postTestLinks.find(x=>x.id===b.dataset.toggleLink);
        l.aktif = l.aktif === false ? true : false;
        await safeSet('posttest_links', postTestLinks);
        renderAdminPostTest(area);
      });
    });
    area.querySelectorAll('[data-del-link]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('Hapus link post-test ini?')) return;
        postTestLinks = postTestLinks.filter(l=>l.id !== b.dataset.delLink);
        await safeSet('posttest_links', postTestLinks);
        renderAdminPostTest(area);
      });
    });
    const cancelLinkBtn = document.getElementById('cancel-link-btn');
    if(cancelLinkBtn) cancelLinkBtn.addEventListener('click', ()=>{ editingLinkId = null; renderAdminPostTest(area); });

    document.getElementById('save-link-btn').addEventListener('click', async ()=>{
      const msgEl = document.getElementById('link-form-msg');
      const judul = document.getElementById('l-judul').value.trim();
      const deskripsi = document.getElementById('l-deskripsi').value.trim();
      const url = document.getElementById('l-url').value.trim();
      if(!judul || !url){ msgEl.innerHTML = '<div class="msg error">Judul dan URL wajib diisi.</div>'; return; }
      if(editing){ editing.judul = judul; editing.deskripsi = deskripsi; editing.url = url; }
      else{ postTestLinks.push({ id: uid(), judul, deskripsi, url, aktif:true }); }
      msgEl.innerHTML = '<div class="loading">Menyimpan...</div>';
      await safeSet('posttest_links', postTestLinks);
      editingLinkId = null;
      renderAdminPostTest(area);
    });

    document.getElementById('save-nilai-btn').addEventListener('click', async ()=>{
      const msgEl = document.getElementById('nilai-form-msg');
      const kode = normKode(document.getElementById('n-kode').value);
      const linkId = document.getElementById('n-link').value;
      const skor = parseInt(document.getElementById('n-skor').value, 10);
      if(!kode || !pesertaData[kode]){ msgEl.innerHTML = '<div class="msg error">Kode peserta tidak ditemukan. Tambahkan peserta terlebih dahulu di tab Peserta.</div>'; return; }
      if(!linkId){ msgEl.innerHTML = '<div class="msg error">Pilih link post-test.</div>'; return; }
      if(isNaN(skor) || skor < 0 || skor > 100){ msgEl.innerHTML = '<div class="msg error">Masukkan skor 0-100.</div>'; return; }
      if(!postTestResults[kode]) postTestResults[kode] = {};
      postTestResults[kode][linkId] = { skor, waktu: new Date().toISOString() };
      msgEl.innerHTML = '<div class="loading">Menyimpan...</div>';
      await safeSet('posttest_results', postTestResults);
      renderAdminPostTest(area);
    });

    area.querySelectorAll('[data-del-nilai]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if(!confirm('Hapus nilai ini? Peserta perlu diinput ulang oleh admin jika diperlukan.')) return;
        const [kode, linkId] = b.dataset.delNilai.split('|');
        if(postTestResults[kode]){
          delete postTestResults[kode][linkId];
          if(!Object.keys(postTestResults[kode]).length) delete postTestResults[kode];
        }
        await safeSet('posttest_results', postTestResults);
        renderAdminPostTest(area);
      });
    });
  }

  // --- Admin: Sertifikat ---
  function renderAdminSertifikat(area){
    const cfg = sertifikatConfig;
    area.innerHTML = `
      <div class="card">
        <h2>Pengaturan Sertifikat</h2>
        <p class="hint">Placeholder yang bisa dipakai di teks sertifikat: <b>{nama} {kode} {batch} {tanggal} {program} {perusahaan}</b></p>
        <label>Nama Program Pelatihan</label>
        <input type="text" id="c-program" value="${esc(cfg.programName)}" />
        <label>Nama Perusahaan</label>
        <input type="text" id="c-perusahaan" value="${esc(cfg.perusahaan)}" />
        <label>Nama Penandatangan</label>
        <input type="text" id="c-penandatangan" value="${esc(cfg.penandatangan)}" placeholder="mis. Syafran Umari, SE" />
        <label>Jabatan Penandatangan</label>
        <input type="text" id="c-jabatan" value="${esc(cfg.jabatan)}" placeholder="mis. General Manager" />
        <div class="divider"></div>
        <label style="margin-top:0;">Teks Sertifikat &mdash; Peserta LULUS</label>
        <textarea id="c-lulus" style="min-height:110px;">${esc(cfg.templateLulus)}</textarea>
        <label>Teks Surat Keterangan &mdash; Peserta TIDAK LULUS</label>
        <textarea id="c-tidaklulus" style="min-height:110px;">${esc(cfg.templateTidakLulus)}</textarea>
        <button class="btn" id="save-cert-btn">Simpan Pengaturan Sertifikat</button>
        <div id="cert-config-msg"></div>
      </div>
      <div class="card">
        <h2>Pratinjau</h2>
        <p class="hint">Contoh tampilan sertifikat memakai data contoh.</p>
        <div class="row-actions">
          <button class="btn secondary small" id="preview-lulus-btn">Pratinjau Sertifikat Lulus</button>
          <button class="btn secondary small" id="preview-tidaklulus-btn">Pratinjau Surat Keterangan</button>
        </div>
        <div id="cert-preview-area" style="margin-top:16px;"></div>
      </div>
    `;

    function currentDraftCfg(){
      return {
        programName: document.getElementById('c-program').value.trim(),
        perusahaan: document.getElementById('c-perusahaan').value.trim(),
        penandatangan: document.getElementById('c-penandatangan').value.trim(),
        jabatan: document.getElementById('c-jabatan').value.trim(),
        templateLulus: document.getElementById('c-lulus').value,
        templateTidakLulus: document.getElementById('c-tidaklulus').value
      };
    }
    const samplePeserta = { nama:'Nama Contoh Peserta', batch:'1', tanggal:'30 Juli 2026' };

    document.getElementById('preview-lulus-btn').addEventListener('click', ()=>{
      document.getElementById('cert-preview-area').innerHTML = `<div class="cert-wrap-outer">${certInnerHTML(samplePeserta, 'JEI-0001', true, currentDraftCfg())}</div>`;
    });
    document.getElementById('preview-tidaklulus-btn').addEventListener('click', ()=>{
      document.getElementById('cert-preview-area').innerHTML = `<div class="cert-wrap-outer">${certInnerHTML(samplePeserta, 'JEI-0001', false, currentDraftCfg())}</div>`;
    });

    document.getElementById('save-cert-btn').addEventListener('click', async ()=>{
      const msgEl = document.getElementById('cert-config-msg');
      sertifikatConfig = currentDraftCfg();
      msgEl.innerHTML = '<div class="loading">Menyimpan...</div>';
      await safeSet('sertifikat_config', sertifikatConfig);
      msgEl.innerHTML = '<div class="msg info">Pengaturan sertifikat berhasil disimpan.</div>';
    });
  }


  // --- Admin: Kelola Menu ---
  let menuDraft = null;

  function renderAdminMenu(area){
    if(!menuDraft) menuDraft = menuConfig.map(t=>({...t}));
    area.innerHTML = `
      <div class="card">
        <h2>Kelola Menu / Toolbar</h2>
        <p class="hint">Ubah label, sembunyikan, urutkan, atau tambah menu baru. Menu inti (Cek Kelulusan, Post Test, Rapot) tidak bisa dihapus, hanya disembunyikan.</p>
        <div id="menu-rows"></div>
        <div class="divider"></div>
        <label style="margin-top:0;">Tambah Menu Baru</label>
        <input type="text" id="new-menu-label" placeholder="Judul menu, mis. Info / Kontak" />
        <label>Isi Konten</label>
        <textarea id="new-menu-content" placeholder="Tulis isi halaman ini (bebas, per baris jadi paragraf baru)"></textarea>
        <button class="btn secondary small" id="add-menu-btn" style="width:100%;">+ Tambah Menu</button>
        <div class="row-actions">
          <button class="btn" id="save-menu-btn">Simpan Perubahan Menu</button>
        </div>
        <div id="menu-msg"></div>
      </div>
    `;
    renderMenuRows();

    document.getElementById('add-menu-btn').addEventListener('click', ()=>{
      const label = document.getElementById('new-menu-label').value.trim();
      const content = document.getElementById('new-menu-content').value.trim();
      if(!label){ return; }
      menuDraft.push({ id: uid(), type:'custom', label, content, visible:true });
      document.getElementById('new-menu-label').value = '';
      document.getElementById('new-menu-content').value = '';
      renderMenuRows();
    });

    document.getElementById('save-menu-btn').addEventListener('click', async ()=>{
      const msgEl = document.getElementById('menu-msg');
      if(!menuDraft.some(t=>t.visible !== false)){
        msgEl.innerHTML = '<div class="msg error">Minimal satu menu harus tetap terlihat.</div>';
        return;
      }
      msgEl.innerHTML = '<div class="loading">Menyimpan...</div>';
      menuConfig = menuDraft.map(t=>({...t}));
      await safeSet('menu_config', menuConfig);
      renderNav();
      msgEl.innerHTML = '<div class="msg info">Menu berhasil diperbarui.</div>';
    });
  }

  function renderMenuRows(){
    const wrap = document.getElementById('menu-rows');
    if(!wrap) return;
    wrap.innerHTML = menuDraft.map((t,i)=>`
      <div class="menu-row">
        <div class="menu-btns">
          <button class="btn tiny secondary" data-up="${i}" ${i===0?'disabled':''}>&uarr;</button>
          <button class="btn tiny secondary" data-down="${i}" ${i===menuDraft.length-1?'disabled':''}>&darr;</button>
        </div>
        <input type="text" data-label="${i}" value="${esc(t.label)}" />
        <span class="menu-type">${t.type==='custom' ? 'custom' : 'inti'}</span>
        <label class="switch"><input type="checkbox" data-visible="${i}" ${t.visible!==false?'checked':''}/> Tampil</label>
        ${t.type==='custom' ? `<button class="btn tiny danger" data-del-menu="${i}">Hapus</button>` : ''}
      </div>
      ${t.type==='custom' ? `<textarea data-content="${i}" placeholder="Isi konten menu" style="margin-bottom:10px;">${esc(t.content||'')}</textarea>` : ''}
    `).join('');

    wrap.querySelectorAll('[data-label]').forEach(inp=>{ inp.addEventListener('input', ()=>{ menuDraft[inp.dataset.label].label = inp.value; }); });
    wrap.querySelectorAll('[data-content]').forEach(inp=>{ inp.addEventListener('input', ()=>{ menuDraft[inp.dataset.content].content = inp.value; }); });
    wrap.querySelectorAll('[data-visible]').forEach(inp=>{ inp.addEventListener('change', ()=>{ menuDraft[inp.dataset.visible].visible = inp.checked; }); });
    wrap.querySelectorAll('[data-del-menu]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ menuDraft.splice(parseInt(btn.dataset.delMenu,10),1); renderMenuRows(); });
    });
    wrap.querySelectorAll('[data-up]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.dataset.up,10);
        [menuDraft[i-1], menuDraft[i]] = [menuDraft[i], menuDraft[i-1]];
        renderMenuRows();
      });
    });
    wrap.querySelectorAll('[data-down]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.dataset.down,10);
        [menuDraft[i+1], menuDraft[i]] = [menuDraft[i], menuDraft[i+1]];
        renderMenuRows();
      });
    });
  }

  // --- Admin: PIN ---
  function renderAdminPin(area){
    area.innerHTML = `
      <div class="card">
        <h2>Ubah PIN Admin</h2>
        <p class="hint">PIN ini dipakai untuk masuk ke area Admin. Bagikan hanya ke trainer/PIC yang berwenang.</p>
        <label>PIN Baru</label>
        <input type="text" id="new-pin" class="mono" placeholder="Minimal 4 karakter" />
        <button class="btn" id="save-pin-btn">Simpan PIN</button>
        <div id="pin-msg"></div>
      </div>
    `;
    document.getElementById('save-pin-btn').addEventListener('click', async ()=>{
      const val = document.getElementById('new-pin').value.trim();
      const msgEl = document.getElementById('pin-msg');
      if(val.length < 4){ msgEl.innerHTML = '<div class="msg error">PIN minimal 4 karakter.</div>'; return; }
      msgEl.innerHTML = '<div class="loading">Menyimpan...</div>';
      await safeSet('admin_pin', val);
      msgEl.innerHTML = '<div class="msg info">PIN berhasil diperbarui.</div>';
    });
  }

  // ================= INIT =================
  (async function init(){
    await loadAll();
    renderNav();
    renderActiveTab();
  })();

})();
</script>
</body>
</html>
